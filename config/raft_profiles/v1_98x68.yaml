# Profile hình học thân bè V1 dự phòng: 98 x 68 x 25 cm (TBD-06 / RI-1.5)
# Phương án mở rộng kích thước nếu thân 70x50 không đạt thử nghiêng cổng G-ST.
# Cần nhóm C2/C3 xác nhận tọa độ chi tiết khi kích hoạt profile này (A.14 Mục 5).

profile_name: v1_98x68
status: fallback_expanded_tbd06

hull:
  length_m: 0.98
  width_m: 0.68
  height_m: 0.25
  freeboard_nominal_m: null   # Chờ đo thực tế sau thử nghiêng G-ST (TBD-06)
  total_height_above_water_m: 0.45  # Chiều cao trên mặt nước gồm mạn khô + camera/vật thể di sản [chờ C2/C3]

# Quy ước hệ tọa độ thân bè (base_link): +X về mũi, +Y sang trái (port), +Z hướng lên từ mặt boong.
camera_oak_d_pro_w:
  mount_height_above_deck_m: 0.20
  alpha_tilt_deg: 0.0
  position_xyz_m: [0.44, 0.00, 0.20]   # [placeholder - chờ nhóm C2/C3 xác nhận]
  color_sensor: OV9782
  stereo_sensor: OV9282
  depth_hz: 15.0
  vio_hz: 15.0
  imu_hz: 200.0
  usb3_required: true

gnss_dual_antenna:
  use_compass: false
  primary_antenna_xyz_m: [0.30, 0.00, 0.10]     # [placeholder - chờ nhóm C2/C3 xác nhận]
  secondary_antenna_xyz_m: [-0.30, 0.00, 0.10]  # [placeholder - chờ nhóm C2/C3 xác nhận]

thrusters:
  esc_count: 3
  esc_model: "Holybro Tekko32 F4 45A (AM32)"
  esc_current_limit_a: 30.0
  pwm_khz: 24
  dshot_bidirectional: true
  units:
    left:
      role: primary_port
      position_xyz_m: [-0.44, 0.25, -0.10]   # [placeholder - chờ nhóm C2/C5 xác nhận]
    right:
      role: primary_starboard
      position_xyz_m: [-0.44, -0.25, -0.10]  # [placeholder - chờ nhóm C2/C5 xác nhận]
    stern_backup:
      role: backup_center
      position_xyz_m: [-0.46, 0.00, -0.10]   # [placeholder - chờ nhóm C2/C5 xác nhận]

safety_envelope:
  length_m: 1.18
  width_m: 0.88
  min_clearance_margin_m: 0.10
