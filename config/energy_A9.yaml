# Cấu hình quản lý năng lượng Mục A.9 (CdCT Final 2.0)
# Đo chính bằng shunt (Pixhawk 6C); BMS chỉ đối chiếu qua Bluetooth LE (TBD-23).

energy_management:
  loop_rate_hz: 1.0
  total_capacity_wh: 1280.0      # 2 x 640 Wh LFP
  stop_reserve_wh: 128.0         # 10% dự trữ cứng không xâm phạm
  safety_margin_wh: 64.0         # 5% dự phòng bù dòng/gió
  warn_soc_pct: 28.0             # Ngưỡng cảnh báo WARN
  warn_wh_p95_2km: 227.3         # Ở P95 = 122 W, cự ly 2 km
  rtb_soc_pct: 21.0              # Ngưỡng quay về bến RTB (S10)
  rtb_wh_p95_2km: 145.7
  stop_soc_pct: 10.0             # Ngưỡng dừng STOP (BATT_CRT)
  l1_batt_crt_v_min: 11.5
  l1_batt_crt_v_max: 12.0
  bms_hw_cutoff_v: 10.0
  primary_measurement: shunt
  bms_interface: bluetooth_le
  bms_ble_loss_policy: warn_only_no_stop
  lua_total_current_limit_normal_a: 70.0
  lua_total_current_limit_backup_a: 40.0
  esc_current_limit_a: 30.0
  esc_count: 3
