# Nguồn chân lý máy đọc (Single Source of Truth) cho CdCT Final 2.0 (A.8, A.9.3, A.10, TR-4.16, TR-8.3)
# Mọi trạng thái, cạnh chuyển trạng thái, thứ tự ưu tiên và ngưỡng an toàn trong mã nguồn
# phải trích trực tiếp từ tệp này (PROJECT_RULES.md Luật cứng #7).

version: "CdCT-Final-2.0"

a8_fsm:
  # Thứ tự ưu tiên cứng: S9 > S8 > S12 > S7 > S11 > S10 > S1
  priority_order: [9, 8, 12, 7, 11, 10, 1]

  states:
    0:
      code: "S0"
      name: "INIT_PRECHECK"
      description: "Khởi tạo và kiểm tra trước chạy (cổng USB 3 camera OAK-D Pro W & đủ node sống)"
    1:
      code: "S1"
      name: "MISSION_PATROL"
      description: "Hành trình tuần tra trong hành lang Z1"
    2:
      code: "S2"
      name: "BRIDGE_APPROACH"
      description: "Tiếp cận cầu (>= 10 m trước cầu, giảm tốc <= 2 km/h)"
    3:
      code: "S3"
      name: "BRIDGE_CENTERING"
      description: "Canh giữa theo hai thành cầu (±25 cm, quá hạn 30 s -> S7)"
    4:
      code: "S4"
      name: "BRIDGE_CLEARANCE_MEASURE"
      description: "Đo tĩnh không gầm cầu Config B 800P (>= chiều cao bè + 0.10 m, đối chiếu CSDL ±0.05 m)"
    5:
      code: "S5"
      name: "BRIDGE_TRANSIT"
      description: "Đi qua gầm cầu (bắt buộc bridge_permit còn hạn, BRIDGE_ZONE, EKF source=2 VIO)"
    6:
      code: "S6"
      name: "BRIDGE_EXIT"
      description: "Thoát gầm cầu & khóa lại RTK/GNSS (mất RTK > 30 s -> S12 hoặc S7 + HOLD-ALL)"
    7:
      code: "S7"
      name: "HOLD_WAIT"
      description: "Chờ / Hold (lỗi bậc 1 cần dừng chờ, S3 quá hạn, S4 chưa đủ tĩnh không, mất RTK/camera, ngoài Z2, nhận HOLD-ALL, tới bến từ S10)"
    8:
      code: "S8"
      name: "BRIDGE_EMERGENCY_EXIT"
      description: "Rời gầm cầu khẩn cấp khi có sự cố trong cầu S5 mà vẫn còn lực đẩy"
    9:
      code: "S9"
      name: "EMERGENCY_STOP"
      description: "Mất toàn bộ lực đẩy / E-stop / lỗi bậc 3 ngoài cầu + HOLD-ALL <= 2 s"
    10:
      code: "S10"
      name: "RTB_RETURN_TO_BASE"
      description: "Về bến theo hành trình (tới bến -> S7)"
    11:
      code: "S11"
      name: "OBSTACLE_AVOID"
      description: "Lách vật cản (khoảng trống g >= 1.35 m, trong Z2 ±1.25 m, <= 10 s; ưu tiên cao hơn S10)"
    12:
      code: "S12"
      name: "DDKC_EMERGENCY_BERTH"
      description: "Tới ĐDKC (lỗi bậc 2: lệch Z1 0.30..0.50 m > 5 s không hiệu chỉnh được sau thử lại, SoC <= 10% còn lực đẩy, mất RTK S6 > 30 s, lách S11 thất bại)"

  allowed_transitions:
    # Hành trình & Lách vật cản (S11)
    - [0, 1]
    - [1, 11]
    - [11, 1]
    - [10, 11]
    - [11, 10]
    - [11, 7]
    - [11, 12]
    # Chuỗi qua gầm cầu (S2 -> S3 -> S4 -> S5 -> S6 -> S1)
    - [1, 2]
    - [2, 3]
    - [3, 4]
    - [3, 7]
    - [4, 5]
    - [4, 7]
    - [7, 4]
    - [5, 6]
    - [6, 1]
    - [6, 12]
    - [6, 7]
    # RTB & Hold
    - [1, 10]
    - [2, 10]
    - [10, 7]
    - [1, 7]
    - [2, 7]
    - [7, 1]
    - [7, 10]
    - [7, 12]
    - [7, 0]
    # Lỗi bậc 2 -> ĐDKC (S12)
    - [1, 12]
    - [2, 12]
    - [3, 12]
    - [4, 12]
    - [10, 12]
    - [12, 7]
    - [12, 10]
    - [12, 0]
    # Thoát cầu khẩn cấp khi còn lực đẩy (S8)
    - [5, 8]
    - [8, 12]
    - [8, 7]
    - [8, 0]
    # Mất toàn bộ lực đẩy / E-stop / lỗi bậc 3 ngoài cầu (S9)
    - [0, 9]
    - [1, 9]
    - [2, 9]
    - [3, 9]
    - [4, 9]
    - [5, 9]
    - [6, 9]
    - [7, 9]
    - [8, 9]
    - [10, 9]
    - [11, 9]
    - [12, 9]
    - [9, 0]

  timeouts:
    s3_centering_timeout_s: 30.0
    s6_rtk_timeout_s: 30.0
    s11_avoid_max_s: 10.0
    hold_all_deadline_s: 2.0
    bridge_permit_ttl_s: 15.0

tr_4_16_corridor:
  z1_half_width_m: 0.30
  z1_correction_max_m: 0.50
  z1_excursion_timeout_s: 5.0
  z1_max_retries: 1
  z2_half_width_m: 1.25
  obstacle_min_gap_m: 1.35
  bridge_approach_dist_m: 10.0
  bridge_centering_tol_m: 0.25

s4_clearance:
  min_margin_above_raft_m: 0.10
  db_tolerance_m: 0.05
  consensus_spread_max_m: 0.05
  max_speed_kmh: 2.0

a9_3_energy:
  warn_enter_soc_pct: 28.0
  warn_clear_soc_pct: 30.0
  rtb_soc_pct: 21.0
  ddkc_soc_pct: 10.0
  l1_batt_crt_v_min: 11.5
  bms_hw_cutoff_v: 10.0

a10_tr83_c8:
  loop_min_hz: 100
  keepalive_timeout_ms: 3000
  bridge_zone_timeout_ms: 60000
  lora_run_freshness_ms: 30000
  sensor_stale_timeout_ms: 500
  dynamic_tilt_deg: 15.0
  dynamic_tilt_window_ms: 200
  static_tilt_deg: 3.0
  static_tilt_window_ms: 1000
  load_delta_kg: 10.0
  load_delta_window_ms: 200
  boot_counter_jump: 1000
